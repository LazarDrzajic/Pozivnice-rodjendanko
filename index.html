<style>
/* Layout: festive header, optional category sidebar on the left (appears once any video has a category), 10-card grid, numbered pages below. */
:root {
  color-scheme: only light;
  --bg: #faf5eb; /* page background: change this colour (white: #ffffff) */
  --surface: #ffffff;
  --fg: #7b3ff2; /*#2a1f3d;*/
  --muted: #7b3ff2; /*#6c5f82;*/
  --line: #e6dccb;
  --accent: #7b3ff2;
  --accent-fg: #ffffff;
  --c1: #ff5a5f;
  --c2: #ffb400;
  --c3: #1fbf9f;
  --c4: #3a86ff;
  --c5: #9b4dff;
  --k1: #00a3ef;
  --k2: #e8302f;
  --k3: #eaca18;
  --k4: #c53da2;
  --k5: #82c846;
  --title-stroke: #2a1f3d;
  --shadow: 0 1px 2px rgba(60, 20, 90, .06), 0 8px 24px rgba(60, 20, 90, .08);
  --font-display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  position: relative;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 32px; --h1: clamp(2.2rem, 6vw, 4rem); }
/* The Russian headline is the longest, so it is set a little smaller to stay clear of the language dropdown. */
html[lang="ru"] .wrap { --h1: clamp(2rem, 4.6vw, 3.1rem); }

/* Header */
.top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
.top h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--h1);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.top h1 .row { display: block; }
.top h1 .ch { -webkit-text-stroke: 2px var(--title-stroke); paint-order: stroke fill; }
.k0 { color: var(--k1); }
.k1 { color: var(--k2); }
.k2 { color: var(--k3); }
.k3 { color: var(--k4); }
.k4 { color: var(--k5); }
.top p { margin: 10px auto 0; color: var(--muted); max-width: 80ch; text-wrap: balance; }
.confetti { display: flex; gap: 6px; align-items: center; justify-content: center; }
.confetti i { display: block; width: 14px; height: 14px; border-radius: 50%; }
.confetti i:nth-child(1) { background: var(--c1); }
.confetti i:nth-child(2) { background: var(--c2); border-radius: 3px; transform: rotate(20deg); }
.confetti i:nth-child(3) { background: var(--c3); }
.confetti i:nth-child(4) { background: var(--c4); border-radius: 3px; transform: rotate(-15deg); }
.confetti i:nth-child(5) { background: var(--c5); }
.count { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Body layout */
.layout { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.layout.has-side { grid-template-columns: 220px minmax(0, 1fr); }

/* Category sidebar */
.side h2 {
  font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 12px; font-weight: 600;
}
.cats { display: flex; flex-direction: column; gap: 4px; }
.cat {
  font: inherit; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: transparent; color: var(--fg);
  border: 0; border-radius: 10px; padding: 9px 12px;
}
.cat:hover { background: var(--surface); }
.cat[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.cat small { font-variant-numeric: tabular-nums; opacity: .7; }

/* Grid */
.grid { display: grid; gap: 24px 20px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.card { display: block; color: inherit; text-decoration: none; min-width: 0; }
.thumb {
  position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); isolation: isolate;
  transition: transform .2s ease, box-shadow .2s ease;
}
.thumb .tile { position: absolute; inset: 0; z-index: 0; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.play {
  position: absolute; z-index: 2; left: 50%; top: 50%;
  width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(255, 255, 255, .94);
  display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  transition: transform .2s ease;
}
.play::after {
  content: ""; margin-left: 4px;
  border-left: 15px solid #2a1f3d; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
}
a.card:hover .thumb, a.card:focus-visible .thumb { transform: translateY(-4px); }
a.card:hover .play, a.card:focus-visible .play { transform: scale(1.1); }
a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 14px; }
.card h3 {
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25;
  margin: 12px 2px 2px; text-wrap: balance;
}
.card .tag { font-size: .8rem; color: var(--muted); margin: 0 2px; }
.card.empty { cursor: default; }
.card.empty .play { opacity: .55; }

/* Generated thumbnail tiles (shown when no thumbnail image loads) */
.tile { background: linear-gradient(135deg, var(--a), var(--b)); }
.tile::before, .tile::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .22); }
.tile::before { width: 46%; aspect-ratio: 1; right: -8%; top: -30%; }
.tile::after { width: 22%; aspect-ratio: 1; left: 8%; bottom: -12%; }
.t0 { --a: var(--c1); --b: var(--c2); }
.t1 { --a: var(--c4); --b: var(--c5); }
.t2 { --a: var(--c3); --b: var(--c4); }
.t3 { --a: var(--c5); --b: var(--c1); }
.t4 { --a: var(--c2); --b: var(--c3); }

/* Pagination */
.pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 40px; }
.pager button {
  font: inherit; font-variant-numeric: tabular-nums; cursor: pointer;
  min-width: 42px; height: 42px; padding: 0 14px; border-radius: 21px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
}
.pager button:hover:not(:disabled) { border-color: var(--accent); }
.pager button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.pager button:disabled { opacity: .4; cursor: default; }
.pager button:focus-visible, .cat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.none { color: var(--muted); padding: 32px 0; }

[hidden] { display: none !important; }

/* Video player (opens over the page) */
.player {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(15, 8, 30, .82);
}
.player-box { width: min(960px, 100%); background: var(--surface); color: var(--fg); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.player-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 18px; }
.player-bar h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.player-close {
  font: inherit; cursor: pointer; flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-size: 1.1rem; line-height: 1;
}
.player-close:hover { border-color: var(--accent); }
.player-close:focus-visible, .player-open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.player-frame { position: relative; aspect-ratio: 16 / 9; width: 100%; max-height: calc(100vh - 150px); background: #000; }
/* Phones: a tall frame, so Google Drive's player has room for its controls and portrait videos. */
@media (max-width: 700px) { .player-frame { aspect-ratio: auto; max-height: none; height: 70vh; height: min(70dvh, 150vw); } }
.player-frame iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
.player-open { display: block; padding: 12px 18px; font-size: .875rem; color: var(--muted); }

/* Language selector */
/* Top right corner of the page, centred on the first row of the headline (32px = page padding, 38px = button height). */
.langbar { position: absolute; top: calc(32px + (var(--h1) - 38px) / 2); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }
.lang { position: relative; }
.lang-btn {
  font: inherit; font-size: .875rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 14px 0 12px; border-radius: 19px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
}
.lang-btn:hover { border-color: var(--accent); }
.lang-cur { display: inline-flex; align-items: center; gap: 8px; }
.chev { width: 10px; height: 10px; flex: none; transition: transform .15s ease; }
.lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.flag { display: block; width: 24px; height: 16px; flex: none; border-radius: 3px; box-shadow: 0 0 0 1px rgba(42, 31, 61, .2); }
.lang-menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 100%;
  display: flex; flex-direction: column; gap: 2px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.lang-item {
  font: inherit; font-size: .875rem; cursor: pointer; white-space: nowrap; text-align: left;
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; color: var(--fg); border: 0; border-radius: 10px; padding: 8px 10px;
}
.lang-item:hover, .lang-item[aria-checked="true"] { background: var(--bg); }
.lang-item[aria-checked="true"] { font-weight: 600; }
.lang-btn:focus-visible, .lang-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lang-short { display: none; }
.count:empty { display: none; }

/* Not enough room beside the headline: the dropdown moves above it. */
@media (max-width: 1100px) {
  .langbar { position: static; display: flex; justify-content: flex-end; margin-bottom: -16px; }
}

@media (max-width: 820px) {
  .layout.has-side { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side h2 { display: none; }
  .cats { flex-direction: row; flex-wrap: wrap; }
  .cat { white-space: nowrap; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
}
@media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Footer with contact buttons */
.foot { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 24px; padding: 32px 0 24px; border-top: 1px solid var(--line); }
.foot-title { margin: 0; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
/* Five buttons always stay in one row: they shrink with the screen instead of wrapping. */
.contacts { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 380px; display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px clamp(4px, 2vw, 12px); }
.contact { flex: 1 1 0; min-width: 0; max-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.contact-btn { display: grid; place-items: center; width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 50%; transition: transform .15s ease; }
.contact-btn .logo { display: block; width: 100%; height: 100%; }
.contact[data-key="phone"] .contact-btn { background: #e8302f; color: #fff; box-shadow: var(--shadow); }
.contact[data-key="phone"] .contact-btn svg { width: 50%; height: 50%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
a.contact-btn[href]:hover { transform: translateY(-3px); }
.contact-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.contact .contact-btn[aria-disabled="true"] { opacity: .35; filter: grayscale(.5); box-shadow: none; }
.contact-label { font-size: clamp(.5625rem, 2.6vw, .6875rem); color: var(--muted); text-align: center; overflow-wrap: anywhere; }

/* Phone: compact dropdown in the top right corner, in the empty strip above the headline (the headline starts at 32px). */
@media (max-width: 600px) {
  .langbar { position: absolute; display: block; margin: 0; top: 4px; right: max(16px, env(safe-area-inset-right, 0px)); }
  .lang-btn { height: 26px; padding: 0 7px; gap: 5px; font-size: .75rem; border-radius: 13px; }
  .lang-cur { gap: 5px; }
  .flag { width: 16px; height: 11px; border-radius: 2px; }
  .chev { width: 8px; height: 8px; }
  .lang-full { display: none; }
  .lang-short { display: inline; }
  .lang-menu { padding: 4px; border-radius: 12px; }
  .lang-item { padding: 6px 8px; gap: 8px; font-size: .75rem; }
}
</style>

    subtitle: "Создание статичных, анимированных и мини-игровых приглашений на детские дни рождения. Возможно изготовление на сербском, английском и русском языках.",
    categories: "Категории", all: "Все",
    back: "Назад", next: "Далее",
    prevLabel: "Предыдущая страница", nextLabel: "Следующая страница",
    pageLabel: (n) => "Страница " + n, pagesNav: "Страницы",
    pageOf: (a, b) => "Страница " + a + " из " + b,
    empty: "В этой категории пока нет видео.",
    close: "Закрыть", playerTitle: "Видеоплеер", openDrive: "Не работает? Открыть в Google Drive",
    langLabel: "Язык", names: { sr: "Сербский", en: "Английский", ru: "Русский" },
    contactTitle: "Контакты", phoneLabel: "Телефон"
  }
};

/* Category names in other languages. The key is the category as written in VIDEOS.
   A category that is not listed here is shown as written. */
const CATEGORY_NAMES = {
  "Цртаћи": { en: "Cartoons", ru: "Мультфильмы" },
  "Спорт": { en: "Sport", ru: "Спорт" }
};

/* Contact buttons in the footer. Fill in what you want to show; a button with an empty value stays dimmed and does nothing.
   Phone numbers: international format, e.g. "+381 60 123 4567" (without the leading 0).
   instagram, telegram: your username (e.g. "moj_profil") or the full link to your page. */
const CONTACTS = {
  instagram: "pozivnice_rodjendanko",
  viber: "+381645614603",
  whatsapp: "+381645614603",
  phone: "+381645614603",
  telegram: "+381645614603"
};

/* One entry per video.
   url:       Google Drive share link (File > Share > Anyone with the link).
   title:     headline in Serbian, shown under the thumbnail.
   en, ru:    optional headlines in English and Russian. If missing, the Serbian title is shown.
   thumb:     optional image URL for the thumbnail. Drive links get an automatic one.
   category:  optional. When any video has a category, the left filter sidebar appears. */
const VIDEOS = [
  { title: "Bluey позивница", en: "Bluey invitation", ru: "Приглашение Bluey", url: "https://drive.google.com/file/d/1lD5y_G_rlCVCj7PMkZO6DYUHHOw2rma3/view?usp=drive_link", category: "Цртаћи" },
  { title: "Baby Shark позивница", en: "Baby Shark invitation", ru: "Приглашение Baby Shark", url: "https://drive.google.com/file/d/15kQiWFVgev-ZXIrN39gu1RkNUCqrT97V/view?usp=drive_link", category: "Цртаћи" },
  { title: "Нинџа Корњаче позивница", en: "Ninja Turtles invitation", ru: "Приглашение Черепашки-ниндзя", url: "https://drive.google.com/file/d/1cxzNgz7ibleqk2dDmozfVkKBVdfFlntk/view?usp=drive_link", category: "Цртаћи" },
  { title: "ФК Барселона позивница", en: "FC Barcelona invitation", ru: "Приглашение ФК Барселона", url: "https://drive.google.com/file/d/1NT94v78AobIqn0CslC32HqYBKu2bxXJM/view?usp=drive_link", category: "Спорт" },
  { title: "Sky Патролна шапа позивница", en: "Paw Patrol Sky invitation", ru: "Приглашение Щенячий патруль: Скай", url: "https://drive.google.com/file/d/1RwWemX_t3teIcyW3iNB-rov2WMnbP5_H/view?usp=drive_link", category: "Цртаћи" },
  { title: "ФК Интер позивница", en: "FC Inter invitation", ru: "Приглашение ФК Интер", url: "https://drive.google.com/file/d/1J9fE9FKMUPMhTX0DGogbQwSDYutm6V89/view?usp=sharing", category: "Спорт" },
  { title: "Патролне Шапе позивница", en: "Paw Patrol invitation", ru: "Приглашение Щенячий патруль", url: "https://drive.google.com/file/d/1HfK0oyGFafpMXn42kHqHpL9FElcRM-rl/view?usp=drive_link", category: "Цртаћи" },
  { title: "Нинџа Корњаче 1 позивница", en: "Ninja Turtles 1 invitation", ru: "Приглашение Черепашки-ниндзя 1", url: "https://drive.google.com/file/d/14SZ_AL5x_v3Tc1WwlAtm7lQuvUl32TLq/view?usp=drive_link", category: "Цртаћи" },
  { title: "ФК Бајерн позивница", en: "FC Bayern invitation", ru: "Приглашение ФК Бавария", url: "https://drive.google.com/file/d/1ZjG2H62JE78AaEiDZwYFpA7GVkLWOFIJ/view?usp=drive_link", category: "Спорт" },
  { title: "Принцезин замак позивница", en: "Princess castle invitation", ru: "Приглашение Замок принцессы", url: "https://drive.google.com/file/d/1YbL3ayqOsfnOhjNJKcADfOvxYX0hHoLk/view?usp=drive_link", category: "Остало" },
  { title: "Бака Милин 70. рођендан изненађења", en: "Grandma Mila's 70th Surprise Birthday", ru: "Сюрприз на 70-летие бабушки Милы", url: "", category: "" },
  { title: "Први рођендан близанаца", en: "The Twins' First Birthday", ru: "Первый день рождения близнецов", url: "", category: "" }
];
/* ============================= */

const ALL = "*";
const LANG_ORDER = ["sr", "en", "ru"];
const LANG_KEY = "invitation-gallery-lang";
const state = { page: 1, cat: ALL, lang: "sr" };
const $ = (id) => document.getElementById(id);
const T = () => I18N[state.lang];
const vTitle = (v) => v[state.lang] || v.title;
function catName(c) { const n = CATEGORY_NAMES[c]; return (n && n[state.lang]) || c; }

function driveId(url) {
  if (!url) return "";
  const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
  return m ? m[1] : "";
}
function thumbFor(v) {
  if (v.thumb) return v.thumb;
  const id = driveId(v.url);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w640" : "";
}

function filtered() {
  return state.cat === ALL ? VIDEOS : VIDEOS.filter((v) => v.category === state.cat);
}

let lastFocus = null;
function openPlayer(v) {
  const id = driveId(v.url);
  lastFocus = document.activeElement;
  $("player-title").textContent = vTitle(v);
  $("player-open").href = v.url;
  $("player-iframe").src = "https://drive.google.com/file/d/" + id + "/preview";
  $("player").hidden = false;
  document.body.style.overflow = "hidden";
  $("player-close").focus();
}
function closePlayer() {
  $("player").hidden = true;
  $("player-iframe").src = "about:blank";
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function buildCard(v, i) {
  const hasUrl = !!v.url;
  const el = document.createElement(hasUrl ? "a" : "div");
  el.className = "card" + (hasUrl ? "" : " empty");
  if (hasUrl) { el.href = v.url; el.target = "_blank"; el.rel = "noopener"; }
  if (hasUrl && driveId(v.url)) {
    el.addEventListener("click", (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      openPlayer(v);
    });
  }

  const th = document.createElement("div");
  th.className = "thumb";
  const tile = document.createElement("div");
  tile.className = "tile t" + (i % 5);
  th.appendChild(tile);

  const src = thumbFor(v);
  if (src) {
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.addEventListener("error", () => img.remove());
    img.src = src;
    th.appendChild(img);
  }
  const play = document.createElement("span");
  play.className = "play";
  th.appendChild(play);
  el.appendChild(th);

  const h = document.createElement("h3");
  h.textContent = vTitle(v);
  el.appendChild(h);
  if (v.category) {
    const t = document.createElement("div");
    t.className = "tag"; t.textContent = catName(v.category);
    el.appendChild(t);
  }
  return el;
}

function renderCats() {
  const cats = [...new Set(VIDEOS.map((v) => v.category).filter(Boolean))];
  const side = $("side");
  const on = cats.length > 0;
  side.hidden = !on;
  $("layout").classList.toggle("has-side", on);
  if (!on) return;
  const box = $("cats");
  box.textContent = "";
  [ALL, ...cats].forEach((c) => {
    const b = document.createElement("button");
    b.className = "cat"; b.type = "button";
    b.setAttribute("aria-pressed", String(state.cat === c));
    const n = c === ALL ? VIDEOS.length : VIDEOS.filter((v) => v.category === c).length;
    const label = document.createElement("span"); label.textContent = c === ALL ? T().all : catName(c);
    const count = document.createElement("small"); count.textContent = n;
    b.append(label, count);
    b.addEventListener("click", () => { state.cat = c; state.page = 1; render(); });
    box.appendChild(b);
  });
}

function renderPager(pages) {
  const p = $("pager");
  p.textContent = "";
  if (pages <= 1) return;
  const tx = T();
  const mk = (txt, page, opts = {}) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = txt;
    if (opts.label) b.setAttribute("aria-label", opts.label);
    if (opts.disabled) b.disabled = true;
    if (opts.current) b.setAttribute("aria-current", "page");
    b.addEventListener("click", () => { state.page = page; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    return b;
  };
  p.appendChild(mk(tx.back, state.page - 1, { disabled: state.page === 1, label: tx.prevLabel }));
  for (let i = 1; i <= pages; i++) p.appendChild(mk(String(i), i, { current: i === state.page, label: tx.pageLabel(i) }));
  p.appendChild(mk(tx.next, state.page + 1, { disabled: state.page === pages, label: tx.nextLabel }));
}

function render() {
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / CONFIG.perPage));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * CONFIG.perPage;
  const grid = $("grid");
  grid.textContent = "";
  if (!list.length) {
    const d = document.createElement("div");
    d.className = "none"; d.textContent = T().empty;
    grid.appendChild(d);
  }
  list.slice(start, start + CONFIG.perPage).forEach((v, i) => grid.appendChild(buildCard(v, start + i)));
  $("count").textContent = pages > 1 ? T().pageOf(state.page, pages) : "";
  renderCats();
  renderPager(pages);
}

/* ---- language selector ---- */
function flagEl(id) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "flag");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS(NS, "use");
  use.setAttribute("href", "#" + id);
  svg.appendChild(use);
  return svg;
}
function menuItems() { return [...$("lang-menu").querySelectorAll(".lang-item")]; }
function openMenu(focusItem) {
  $("lang-menu").hidden = false;
  $("lang-btn").setAttribute("aria-expanded", "true");
  if (focusItem) {
    const items = menuItems();
    (items.find((i) => i.getAttribute("aria-checked") === "true") || items[0]).focus();
  }
}
function closeMenu(returnFocus) {
  $("lang-menu").hidden = true;
  $("lang-btn").setAttribute("aria-expanded", "false");
  if (returnFocus) $("lang-btn").focus();
}
const LANG_SHORT = { sr: "СР", en: "EN", ru: "РУ" };
function langLabel(full, code) {
  const box = document.createElement("span");
  box.className = "lang-text";
  const f = document.createElement("span"); f.className = "lang-full"; f.textContent = full;
  const sh = document.createElement("span"); sh.className = "lang-short"; sh.textContent = LANG_SHORT[code];
  box.append(f, sh);
  return box;
}
function renderLangUi() {
  const tx = T();
  const cur = $("lang-cur");
  cur.textContent = "";
  cur.append(flagEl(tx.flag), langLabel(tx.names[state.lang], state.lang));
  $("lang-btn").setAttribute("aria-label", tx.langLabel + ": " + tx.names[state.lang]);
  const menu = $("lang-menu");
  menu.textContent = "";
  menu.setAttribute("aria-label", tx.langLabel);
  LANG_ORDER.forEach((code) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "lang-item";
    b.setAttribute("role", "menuitemradio");
    b.setAttribute("aria-checked", String(code === state.lang));
    b.setAttribute("aria-label", tx.names[code]);
    b.append(flagEl(I18N[code].flag), langLabel(tx.names[code], code));
    b.addEventListener("click", () => setLang(code));
    menu.appendChild(b);
  });
}
function contactHref(key, raw) {
  const v = (raw || "").trim();
  if (!v) return "";
  const digits = v.replace(/\D/g, "");
  const isUrl = /^https?:\/\//i.test(v);
  if (key === "phone") return digits ? "tel:+" + digits : "";
  if (key === "whatsapp") return isUrl ? v : (digits ? "https://wa.me/" + digits : "");
  if (key === "viber") return /^viber:/i.test(v) ? v : (digits ? "viber://chat?number=%2B" + digits : "");
  if (key === "instagram") return isUrl ? v : "https://instagram.com/" + v.replace(/^@/, "");
  if (key === "telegram") return isUrl ? v : "https://t.me/" + v.replace(/^@/, "");
  return "";
}
function renderContacts() {
  const tx = T();
  $("foot-title").textContent = tx.contactTitle;
  $("ct-phone-label").textContent = tx.phoneLabel;
  $("ct-phone").setAttribute("aria-label", tx.phoneLabel);
  $("ct-phone").title = tx.phoneLabel;
  Object.keys(CONTACTS).forEach((key) => {
    const a = $("ct-" + key);
    const href = contactHref(key, CONTACTS[key]);
    if (href) {
      a.href = href;
      a.removeAttribute("aria-disabled");
      a.removeAttribute("tabindex");
      if (href.startsWith("http")) a.target = "_blank"; else a.removeAttribute("target");
    } else {
      a.removeAttribute("href");
      a.removeAttribute("target");
      a.setAttribute("aria-disabled", "true");
      a.tabIndex = -1;
    }
  });
}
function applyLang() {
  const tx = T();
  document.documentElement.lang = state.lang;
  document.title = tx.docTitle;
  const h = $("site-title");
  h.textContent = "";
  let k = 0;
  tx.title.forEach((line) => {
    const row = document.createElement("span");
    row.className = "row";
    [...line].forEach((ch) => {
      if (ch === " ") { row.appendChild(document.createTextNode(" ")); return; }
      const s = document.createElement("span");
      s.className = "ch k" + (k++ % 5);
      s.textContent = ch;
      row.appendChild(s);
    });
    h.appendChild(row);
  });
  h.setAttribute("aria-label", tx.title.join(" "));
  $("site-sub").textContent = tx.subtitle;
  $("side-h").textContent = tx.categories;
  $("cats").setAttribute("aria-label", tx.categories);
  $("pager").setAttribute("aria-label", tx.pagesNav);
  $("player-close").setAttribute("aria-label", tx.close);
  $("player-iframe").title = tx.playerTitle;
  $("player-open").textContent = tx.openDrive;
  renderLangUi();
  renderContacts();
  render();
}
function setLang(code) {
  state.lang = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
  closeMenu(true);
  applyLang();
}
function loadLang() {
  try {
    const c = localStorage.getItem(LANG_KEY);
    if (LANG_ORDER.includes(c)) return c;
  } catch (e) {}
  return "sr";
}

(function init() {
  $("player-close").addEventListener("click", closePlayer);
  $("player").addEventListener("click", (e) => { if (e.target === $("player")) closePlayer(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("player").hidden) closePlayer(); });

  $("lang-btn").addEventListener("click", () => ($("lang-menu").hidden ? openMenu(false) : closeMenu(false)));
  $("lang-btn").addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); openMenu(true); } });
  $("lang-menu").addEventListener("keydown", (e) => {
    const items = menuItems();
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
  });
  document.addEventListener("click", (e) => { if (!$("lang").contains(e.target)) closeMenu(false); });

  state.lang = loadLang();
  applyLang();
})();
</script>
